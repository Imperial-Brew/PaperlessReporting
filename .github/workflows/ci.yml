name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: 🛠 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install linter
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: |
          flake8 scripts utils

  smoke-tests:
    name: 🚑 Smoke tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install requests tqdm

      - name: Pull accounts smoke-test
        run: |
          python scripts/pull_accounts.py --id 22198

      - name: Pull quotes smoke-test
        run: |
          python scripts/pull_quotes.py --id 47
