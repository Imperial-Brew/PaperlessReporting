services:
  - type: web
    name: paperless-webhook
    env: python
    buildCommand: pip install -r requirements.txt
    start_command: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PAPERLESS_API_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: API_BASE_URL
        sync: false
    autoDeploy: true
    plan: free
